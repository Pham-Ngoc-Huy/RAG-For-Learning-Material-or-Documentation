[project]
name = "rag-for-learning-material-or-documentation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markitdown[all]>=0.1.5",
    "numpy>=2.5.1",
    "openai>=2.52.0",
    "sentence-transformers>=5.6.1",
    "qdrant-client>=1.8.0",
    "maturin>=1.14.1",
    "pdf-inspector>=0.2.6",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "python-multipart>=0.0.32",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "omegaconf>=2.3.1",
    "pyyaml>=6.0.3",
    "ffmpeg>=1.4",
    "python-dotenv>=1.0.0",
    "fastembed>=0.8.0",
    "pre-commit>=4.6.2",
    "passlib>=1.7.4",
    "sqlalchemy>=2.0.52",
    "databases>=0.9.0",
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
]

[tool.vercel]
entrypoint = "src.api.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
packages = ["src"]

[tool.ruff]
lint.select = ["E", "F", "I"] # Enable pycodestyle (`E`), Pyflakes (`F`) and Isort(`I`) codes.
lint.ignore = ["E501", "F403"]
line-length = 125
